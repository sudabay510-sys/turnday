{% extends "base.html" %}
{% block title %}Founding list — {{ brand.name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap narrow">
    <h1>Join the founding list</h1>
    <p class="lede">Checkout is not live. Leave your email and we’ll notify you when paid plans open. No charge today.</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="form_token" value="{{ form_token }}"/>
      <input type="hidden" name="tier" value="{{ selected }}"/>
      <label class="field"><span class="label">Email</span>
        <input class="input" type="email" name="email" required autocomplete="email" placeholder="you@business.com"/>
      </label>
      <label class="field"><span class="label">Name (optional)</span>
        <input class="input" type="text" name="name" maxlength="80" autocomplete="name"/>
      </label>
      <p class="tiny muted">Selected planned tier: <strong>{{ selected }}</strong></p>
      <button class="btn btn-primary" type="submit">Save my spot</button>
    </form>
  </div>
</section>
{% endblock %}
